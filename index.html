<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABI STEP | Artificial Business Intelligence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 75% 30%, rgba(32,130,255,.25), transparent 35%),
        linear-gradient(135deg, #03172f 0%, #073c75 55%, #087cc1 100%);
      color: white;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 28px 7%;
      display: flex;
      align-items: center;
    }

   .brand-logo {
  width: 110px;
  height: 110px;
  object-fit: contain;
  border-radius: 50%;
}

   

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 7%;
      text-align: center;
    }

    .hero {
      max-width: 950px;
    }

    .badge {
      display: inline-block;
      padding: 9px 18px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 30px;
      background: rgba(255,255,255,.08);
      letter-spacing: 2px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(55px, 10vw, 110px);
      line-height: .95;
      letter-spacing: 4px;
      margin-bottom: 22px;
    }

    h1 span {
      color: #55baff;
    }

    h2 {
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 400;
      margin-bottom: 18px;
    }

    .slogan {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 700;
      margin-bottom: 35px;
    }

    .line {
      width: 90px;
      height: 4px;
      margin: 0 auto 35px;
      background: #55baff;
      border-radius: 10px;
    }

    .coming {
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: .8;
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 13px;
      opacity: .65;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
     <img src="logo.jpg" alt="ABI STEP - Artificial Business Intelligence" class="brand-logo">
   </header>

    <main>
      <section class="hero">

        <div class="badge">THE NEXT STEP IN BUSINESS</div>

        <h1>ABI <span>STEP</span></h1>

        <h2>Artificial Business Intelligence</h2>

        <div class="line"></div>

        <div class="slogan">
          One Step Ahead. Always.
        </div>

        <div class="coming">
          Something Intelligent Is Coming
        </div>

      </section>
    </main>

    <footer>
      © 2026 ABI STEP. All Rights Reserved.
    </footer>

  </div>
</body>
</html>
