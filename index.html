<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABI STEP | Artificial Business Intelligence</title>

  <meta
    name="description"
    content="ABI STEP - Artificial Business Intelligence. One Step Ahead. Always."
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #062b5c;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }


    /* =========================
       TOP HEADER / LOGO
    ========================= */

    header {
      width: 100%;
      padding: 18px 5%;
      background: #ffffff;
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }


    /* =========================
       HERO IMAGE
    ========================= */

    .hero-image-section {
      width: 100%;
      padding: 0 4%;
      display: flex;
      justify-content: center;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 1500px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(6, 43, 92, 0.12);
    }


    /* =========================
       COMING SOON
    ========================= */

    .coming-soon {
      width: 100%;
      text-align: center;
      padding: 55px 20px 60px;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 153, 255, 0.10),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f4faff 100%
        );
    }

    .coming-small {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 5px;
      color: #168ed1;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .coming-title {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 6px;
      color: #062b5c;
      margin-bottom: 20px;
    }

    .coming-line {
      width: 85px;
      height: 4px;
      margin: 0 auto 22px;
      background: #159fe6;
      border-radius: 10px;
    }

    .coming-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 3px;
      color: #55708f;
      text-transform: uppercase;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 100%;
      text-align: center;
      padding: 24px 20px;
      font-size: 13px;
      color: #6b8199;
      background: #f4faff;
      border-top: 1px solid #e3f0f9;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      header {
        padding: 14px 4%;
      }

      .brand-logo {
        width: 80px;
        height: 80px;
      }

      .hero-image-section {
        padding: 0 3%;
      }

      .hero-image {
        border-radius: 12px;
      }

      .coming-soon {
        padding: 40px 15px 45px;
      }

      .coming-small {
        font-size: 10px;
        letter-spacing: 3px;
      }

      .coming-title {
        font-size: 38px;
        letter-spacing: 3px;
      }

      .coming-text {
        font-size: 11px;
        letter-spacing: 2px;
        line-height: 1.7;
      }

      footer {
        font-size: 12px;
      }
    }

  </style>
</head>


<body>

  <div class="page">


    <!-- ABI STEP LOGO -->

    <header>

      <img
        src="logo.jpg"
        alt="ABI STEP Logo"
        class="brand-logo"
      >

    </header>



    <!-- MAIN HERO IMAGE -->

    <section class="hero-image-section">

      <img
        src="ABIstep%20manrobot.png"
        alt="ABI STEP - Artificial Business Intelligence"
        class="hero-image"
      >

    </section>



    <!-- COMING SOON -->

    <section class="coming-soon">

      <div class="coming-small">
        SOMETHING INTELLIGENT IS COMING
      </div>

      <h1 class="coming-title">
        COMING SOON
      </h1>

      <div class="coming-line"></div>

      <div class="coming-text">
        AI SOLUTIONS FOR A SMARTER BUSINESS TOMORROW
      </div>

    </section>



    <!-- FOOTER -->

    <footer>
      © 2026 ABI STEP. All Rights Reserved.
    </footer>


  </div>

</body>
</html>
