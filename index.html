<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABI STEP | Artificial Business Intelligence</title>

  <meta
    name="description"
    content="ABI STEP - Artificial Business Intelligence. One Step Ahead. Always."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7fcff;
    }

    .landing-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-visual {
      display: block;
      width: 100%;
      max-width: 1920px;
      height: auto;
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 18px 20px;
      font-size: 13px;
      color: #607d9b;
      background: #f7fcff;
    }

    @media (max-width: 768px) {
      .main-visual {
        width: 100%;
        height: auto;
      }

      footer {
        font-size: 11px;
        padding: 15px 10px;
      }
    }
  </style>
</head>

<body>

  <main class="landing-page">

    <img
      src="abistep-visual.png"
      alt="ABI STEP - Artificial Business Intelligence - Coming Soon"
      class="main-visual"
    >

    <footer>
      © 2026 ABI STEP. All Rights Reserved.
    </footer>

  </main>

</body>
</html>
