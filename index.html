<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABI STEP | Artificial Business Intelligence</title>

  <meta
    name="description"
    content="ABI STEP - Artificial Business Intelligence. One Step Ahead. Always."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 75% 35%,
          rgba(0, 153, 255, 0.10),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f7fbff 55%,
          #eef8ff 100%
        );

      color: #062b5c;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP LOGO */

    header {
      width: 100%;
      padding: 20px 5%;
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    /* MAIN HERO IMAGE */

    .hero-image-section {
      flex: 1;
      width: 100%;
      padding: 10px 4% 35px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 1500px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(6, 43, 92, 0.10);
    }

    /* FOOTER */

    footer {
      width: 100%;
      text-align: center;
      padding: 22px 20px;
      font-size: 13px;
      color: #55708f;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      header {
        padding: 15px 5%;
      }

      .brand-logo {
        width: 85px;
        height: 85px;
      }

      .hero-image-section {
        padding: 10px 3% 25px;
      }

      .hero-image {
        border-radius: 12px;
      }

      footer {
        font-size: 12px;
        padding: 18px 10px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <header>
      <img
        src="logo.jpg"
        alt="ABI STEP Logo"
        class="brand-logo"
      >
    </header>


    <main class="hero-image-section">

      <img
        src="ABIstep%20manrobot.png"
        alt="ABI STEP - Artificial Business Intelligence"
        class="hero-image"
      >

    </main>


    <footer>
      © 2026 ABI STEP. All Rights Reserved.
    </footer>

  </div>

</body>
</html>
