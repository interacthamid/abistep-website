<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABI STEP | Artificial Business Intelligence</title>

  <meta
    name="description"
    content="ABI STEP - Artificial Business Intelligence. One Step Ahead. Always."
  >

  <style>

    /* =========================
       GENERAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(0, 153, 255, 0.06),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f8fcff 55%,
          #eef8ff 100%
        );

      color: #062b5c;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }


    /* =========================
       LOGO
    ========================= */

    header {
      width: 100%;
      padding: 15px 5% 0;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .brand-logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }


    /* =========================
       ANIMATED TECHNOLOGY VISUAL
    ========================= */

    .tech-visual {
      width: 100%;
      max-width: 1500px;
      height: 105px;

      margin: -25px auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 5%;

      position: relative;
      overflow: hidden;
    }


    /* LEFT AND RIGHT NETWORK LINES */

    .tech-line {
      position: relative;
      flex: 1;
      max-width: 560px;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(28, 162, 232, 0.20),
        rgba(28, 162, 232, 0.85),
        rgba(28, 162, 232, 0.20),
        transparent
      );

      overflow: visible;
    }


    /* GLOWING MOVING LIGHT */

    .tech-line::before {
      content: "";
      position: absolute;

      top: 50%;
      left: 0;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #18a8ed;

      box-shadow:
        0 0 8px rgba(24, 168, 237, 0.9),
        0 0 18px rgba(24, 168, 237, 0.6);

      transform: translateY(-50%);

      animation: travelLight 4.5s linear infinite;
    }


    .right-line::before {
      animation-delay: 2.25s;
    }


    @keyframes travelLight {

      0% {
        left: 0%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        left: 100%;
        opacity: 0;
      }

    }


    /* SMALL NETWORK DOTS */

    .tech-line::after {
      content: "•  •  •  •  •";
      position: absolute;

      width: 100%;
      left: 0;
      top: -10px;

      text-align: center;

      color: rgba(23, 157, 225, 0.45);

      font-size: 14px;
      letter-spacing: 20px;
    }


    /* =========================
       GLOBE AREA
    ========================= */

    .globe-wrap {
      position: relative;

      width: 95px;
      height: 95px;

      margin: 0 28px;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* MAIN GLOBE */

    .tech-globe {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      border: 2px solid rgba(19, 158, 229, 0.75);

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #e7f8ff 30%,
          #80d5ff 65%,
          #168fd2 100%
        );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 0 15px rgba(20, 158, 230, 0.25),
        0 0 35px rgba(20, 158, 230, 0.15);

      animation: globeRotate 9s linear infinite;
    }


    /* GLOBE LONGITUDE */

    .tech-globe::before {
      content: "";

      position: absolute;

      width: 22px;
      height: 52px;

      border-left: 1px solid rgba(255,255,255,0.85);
      border-right: 1px solid rgba(255,255,255,0.85);

      border-radius: 50%;
    }


    /* GLOBE LATITUDE */

    .tech-globe::after {
      content: "";

      position: absolute;

      width: 50px;
      height: 20px;

      border-top: 1px solid rgba(255,255,255,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.9);

      border-radius: 50%;
    }


    .tech-globe span {
      color: #ffffff;
      font-size: 14px;
      z-index: 2;

      text-shadow:
        0 0 8px #ffffff,
        0 0 15px #1aa5e8;
    }


    @keyframes globeRotate {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================
       ORBITS
    ========================= */

    .orbit {
      position: absolute;

      border-radius: 50%;

      border: 1px solid rgba(26, 158, 225, 0.30);

      pointer-events: none;
    }


    .orbit-one {
      width: 82px;
      height: 44px;

      animation: orbitOne 7s linear infinite;
    }


    .orbit-two {
      width: 44px;
      height: 82px;

      animation: orbitTwo 10s linear infinite reverse;
    }


    @keyframes orbitOne {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes orbitTwo {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================
       HERO IMAGE
    ========================= */

    .hero-image-section {
      width: 100%;

      padding: 0 4%;

      display: flex;
      justify-content: center;
    }


    .hero-image {
      display: block;

      width: 100%;
      max-width: 1500px;

      height: auto;

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(6, 43, 92, 0.12);
    }


    /* =========================
       COMING SOON
    ========================= */

    .coming-soon {
      width: 100%;

      text-align: center;

      padding: 50px 20px 55px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 153, 255, 0.10),
          transparent 45%
        );
    }


    .coming-small {
      font-size: 13px;
      font-weight: 600;

      letter-spacing: 5px;

      color: #168ed1;

      margin-bottom: 18px;

      text-transform: uppercase;
    }


    .coming-title {
      font-size: clamp(42px, 7vw, 78px);

      line-height: 1;

      font-weight: 800;

      letter-spacing: 6px;

      color: #062b5c;

      margin-bottom: 20px;
    }


    .coming-line {
      width: 85px;
      height: 4px;

      margin: 0 auto 22px;

      background: #159fe6;

      border-radius: 10px;
    }


    .coming-text {
      font-size: 15px;

      font-weight: 500;

      letter-spacing: 3px;

      color: #55708f;

      text-transform: uppercase;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 100%;

      text-align: center;

      padding: 24px 20px;

      font-size: 13px;

      color: #6b8199;

      border-top: 1px solid #e3f0f9;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      header {
        padding: 12px 4% 0;
      }


      .brand-logo {
        width: 140px;
        height: 140px;
      }


      .tech-visual {
        height: 75px;

        margin: -10px auto 10px;

        padding: 0 3%;
      }


      .globe-wrap {
        width: 70px;
        height: 70px;

        margin: 0 12px;
      }


      .tech-globe {
        width: 44px;
        height: 44px;
      }


      .tech-globe::before {
        width: 17px;
        height: 39px;
      }


      .tech-globe::after {
        width: 38px;
        height: 15px;
      }


      .orbit-one {
        width: 62px;
        height: 34px;
      }


      .orbit-two {
        width: 34px;
        height: 62px;
      }


      .tech-line::after {
        display: none;
      }


      .hero-image-section {
        padding: 0 3%;
      }


      .hero-image {
        border-radius: 12px;
      }


      .coming-soon {
        padding: 38px 15px 45px;
      }


      .coming-small {
        font-size: 10px;

        letter-spacing: 3px;
      }


      .coming-title {
        font-size: 38px;

        letter-spacing: 3px;
      }


      .coming-text {
        font-size: 11px;

        letter-spacing: 2px;

        line-height: 1.7;
      }


      footer {
        font-size: 12px;
      }

    }


    /* REDUCED MOTION ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {

      .tech-globe,
      .orbit,
      .tech-line::before {
        animation: none;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <!-- =====================
         ABI STEP LOGO
    ====================== -->

    <header>

      <img
        src="logo.jpg"
        alt="ABI STEP Logo"
        class="brand-logo"
      >

    </header>



    <!-- =====================
         ANIMATED GLOBAL NETWORK
    ====================== -->

    <section class="tech-visual">

      <div class="tech-line left-line"></div>


      <div class="globe-wrap">

        <div class="orbit orbit-one"></div>

        <div class="orbit orbit-two"></div>


        <div class="tech-globe">

          <span>✦</span>

        </div>

      </div>


      <div class="tech-line right-line"></div>

    </section>



    <!-- =====================
         MAIN HERO IMAGE
    ====================== -->

    <section class="hero-image-section">

      <img
        src="ABIstep%20manrobot.png"
        alt="ABI STEP - Artificial Business Intelligence"
        class="hero-image"
      >

    </section>



    <!-- =====================
         COMING SOON
    ====================== -->

    <section class="coming-soon">

      <div class="coming-small">
        SOMETHING INTELLIGENT IS COMING
      </div>


      <h1 class="coming-title">
        COMING SOON
      </h1>


      <div class="coming-line"></div>


      <div class="coming-text">
        AI SOLUTIONS FOR A SMARTER BUSINESS TOMORROW
      </div>

    </section>



    <!-- =====================
         FOOTER
    ====================== -->

    <footer>
      © 2026 ABI STEP. All Rights Reserved.
    </footer>


  </div>

</body>
</html>
